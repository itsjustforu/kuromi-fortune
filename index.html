<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創造你的專屬酷洛米！</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap">
<style>
:root{--bg1:#121838;--bg2:#2a1a4d;--panel:#1d1838;--gold:#e2c27a;--gold2:#a88434;--cream:#f8efd6;--muted:#b7a9d6;--rose:#e0709a;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--cream);text-align:center;padding:26px 16px 70px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;overflow-x:hidden;
background:radial-gradient(ellipse at 50% 0,#5a38a0 0,transparent 55%),radial-gradient(ellipse at 50% 100%,#3b1f66 0,transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2) 70%,#1a1030);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;animation:tw 4s ease-in-out infinite alternate;
background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#fff,transparent),radial-gradient(2px 2px at 150px 120px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 140px,#d9c8ff,transparent);background-size:180px 170px}
@keyframes tw{from{opacity:.4}to{opacity:1}}
.lace{position:fixed;left:0;right:0;top:0;height:14px;z-index:5;pointer-events:none;background:radial-gradient(circle at 10px 0,#2a1a4d 6px,var(--gold) 7px,transparent 8px) 0 0/20px 14px repeat-x,linear-gradient(var(--gold2),var(--gold2)) 0 0/100% 2px no-repeat}
.corner{position:fixed;width:84px;height:84px;z-index:4;pointer-events:none;filter:drop-shadow(0 0 5px rgba(226,194,122,.6))}
.c1{top:calc(env(safe-area-inset-top,0px) + 12px);left:4px}.c2{top:calc(env(safe-area-inset-top,0px) + 12px);right:4px;transform:scaleX(-1)}
.c3{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:4px;transform:scaleY(-1)}.c4{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);right:4px;transform:scale(-1)}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.65}90%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px) rotate(200deg);opacity:0}}
main{position:relative;z-index:1;max-width:380px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fin .8s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.home{padding-top:6px}
.seal{position:relative;width:300px;height:300px;margin:6px auto 4px}
.seal>*{position:absolute;inset:0;width:100%;height:100%}
.seal .glow2{border-radius:50%;background:radial-gradient(circle,rgba(190,140,255,.55),transparent 65%);animation:gl2 4s ease-in-out infinite alternate}
@keyframes gl2{from{transform:scale(.85);opacity:.6}to{transform:scale(1.08);opacity:1}}
.z1{animation:spin 50s linear infinite}.z2{animation:spin 36s linear infinite reverse}
.tt{font-size:1.95rem;line-height:1.35;margin:6px 0 8px;font-weight:700;letter-spacing:.05em;background:linear-gradient(180deg,#fff3c9,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.lead{color:var(--muted);line-height:1.8;margin:0 8px;font-size:.95rem}
.gates{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;color:var(--gold);font-size:.85rem}
.gates b{display:block;width:34px;height:34px;line-height:34px;border:1px solid var(--gold);transform:rotate(45deg);margin:0 auto 10px;background:#241a47}
.gates b i{display:block;transform:rotate(-45deg);font-style:normal;font-family:"Cinzel Decorative",Georgia,serif;font-size:.8rem}
#go{font-size:1.2rem;padding:16px 52px;margin-top:22px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 28px rgba(226,194,122,.9),0 3px 10px rgba(0,0,0,.4)}}
.gate{position:relative;background:linear-gradient(180deg,#2a2152,#1b1536);border:2px solid var(--gold);border-radius:24px;padding:26px 12px 20px;margin-top:20px;
box-shadow:inset 0 0 0 5px #1b1536,inset 0 0 0 6px var(--gold2),inset 0 0 40px rgba(160,110,255,.25),0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(160,110,255,.25)}
.gate::before,.gate::after{content:"☾";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--gold);background:#231a43;padding:0 10px;font-size:1.3rem}
.gate::after{content:"";display:none}
.gc{position:absolute;width:52px;height:52px;pointer-events:none}
.g1{top:5px;left:5px}.g2{top:5px;right:5px;transform:scaleX(-1)}.g3{bottom:5px;left:5px;transform:scaleY(-1)}.g4{bottom:5px;right:5px;transform:scale(-1)}
.prog{display:flex;justify-content:center;gap:18px;margin:2px 0 14px}
.prog b{width:26px;height:26px;line-height:26px;border:1px solid var(--gold2);transform:rotate(45deg);background:#241a47;color:var(--muted);font-size:.7rem}
.prog b i{display:block;transform:rotate(-45deg);font-style:normal;font-family:"Cinzel Decorative",Georgia,serif}
.prog b.d{background:linear-gradient(135deg,#f7e0a0,var(--gold2));color:#2a1a4d}
.prog b.c{border-color:#fff3c9;color:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 2s infinite}
.ribbon{display:inline-block;padding:7px 40px;margin:6px 0 8px;background:linear-gradient(180deg,#f7e0a0,var(--gold2));color:#2a1a4d;font-weight:700;letter-spacing:.25em;font-size:1.1rem;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%)}
.hint{color:var(--muted);font-size:.9rem;margin:0 10px}
.dial{position:relative;width:300px;height:300px;margin:12px auto 0;max-width:100%}
.dial>*{position:absolute}
.dial .glow3{inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(190,140,255,.5),transparent 70%)}
.dial .sun{inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(226,194,122,.3) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 46%,#000 47%,#000 70%,transparent 72%);animation:spin 40s linear infinite}
.dial .zr{inset:0;width:100%;height:100%;animation:spin 60s linear infinite reverse}
.dial .wh{left:35px;top:35px;width:230px;height:230px;overflow:visible;filter:drop-shadow(0 0 12px rgba(180,130,255,.55))}
.dial .ptr{left:50%;top:22px;transform:translateX(-50%);width:0;height:0;border:12px solid transparent;border-top:24px solid var(--gold);border-bottom:0;z-index:3;filter:drop-shadow(0 2px 2px #000)}
.dial .bh{left:50%;top:50%;width:0;height:0}
.rot{transform-origin:100px 100px;transition:transform 4s cubic-bezier(.1,.7,.1,1)}
.res{min-height:1.5em;margin-top:12px;color:#ffb3d0;font-weight:700;font-size:1.15rem}
.fort{min-height:2.6em;color:var(--cream);font-size:.92rem;line-height:1.7;margin:2px 14px 0;opacity:0;transition:opacity 1s}
.fort.on{opacity:1}
.nxt{font-size:.82rem;color:var(--gold);margin-top:6px;min-height:1.2em;letter-spacing:.1em}
/* overlay */
#ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#3a2276,#0d0a22 75%)}
#ov.on{display:flex}
.magic{position:relative;width:min(78vw,320px);aspect-ratio:1}
.magic svg{position:absolute;inset:0;width:100%;height:100%}
.m1{animation:spin 14s linear infinite}.m2{animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mcard{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:2/3;transform:translate(-50%,-50%);animation:fy 1.6s ease-in-out infinite alternate}
@keyframes fy{from{transform:translate(-50%,-54%) rotateY(-25deg)}to{transform:translate(-50%,-46%) rotateY(25deg)}}
.mcard svg{position:static;width:100%;height:100%;filter:drop-shadow(0 0 16px #e2c27a)}
#st{margin-top:30px;color:var(--gold);letter-spacing:.12em;font-size:1.05rem;min-height:1.5em}
.bar{width:220px;height:8px;border:1px solid var(--gold);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),#fff3c9);transition:width 5.6s linear}
#fx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.sp{position:absolute;left:50%;top:50%;font-size:14px;pointer-events:none;animation:bst 1.6s ease-out forwards}
@keyframes bst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(180deg);opacity:0}}
/* card view */
.stage{position:relative;width:300px;max-width:84vw;margin:22px auto 8px;perspective:1200px;aspect-ratio:640/954;animation:drop 1.2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{transform:translateY(-120px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.3,.8,.2,1)}
.inner.go{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;box-shadow:0 0 30px rgba(190,140,255,.6)}
.face svg,.face img{width:100%;height:100%;display:block}
.front{transform:rotateY(180deg);border:2px solid var(--gold)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#fff7 50%,transparent 65%) -150% 0/250% 100% no-repeat;animation:shine 3.5s 2.4s infinite}
@keyframes shine{to{background-position:150% 0}}
.glow{animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{from{filter:drop-shadow(0 0 10px rgba(180,130,255,.5))}to{filter:drop-shadow(0 0 26px rgba(226,194,122,.85))}}
#bst{position:absolute;left:50%;top:50%;width:0;height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px}
.chip{border:1px solid var(--gold);border-radius:99px;padding:5px 14px;font-size:.88rem;background:#241a47;color:var(--cream);opacity:0;animation:fin .7s forwards}
.t2{font-family:"Cinzel Decorative",Georgia,serif;color:var(--gold);letter-spacing:.2em;margin:6px 0 0;font-size:1.1rem}
.cap{color:var(--rose);letter-spacing:.3em;font-size:.85rem;margin:18px 0 0}
.gates{gap:8px;margin:12px 0 4px}
.gates>div{flex:1;max-width:84px;padding:12px 4px 8px;border:1px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,#38285f,#211a40);font-size:.8rem;line-height:1.5;box-shadow:0 0 14px rgba(224,112,154,.3),inset 0 0 0 3px #211a40,inset 0 0 0 4px var(--gold2);animation:bob 3s ease-in-out infinite}
.gates>div:nth-child(2){animation-delay:-.7s}.gates>div:nth-child(3){animation-delay:-1.4s}.gates>div:nth-child(4){animation-delay:-2.1s}
@keyframes bob{50%{transform:translateY(-6px)}}
.gates b{margin-bottom:10px}.gates b i{font-size:1.05rem}
.gates small{display:block;color:var(--gold);font-family:"Cinzel Decorative",Georgia,serif;font-size:.65rem;letter-spacing:.1em;margin-top:2px}
#spin{font-size:1.4rem;padding:19px 0;width:88%;max-width:310px;margin-top:22px;border-width:2px;letter-spacing:.14em;animation:pulse 1.8s ease-in-out infinite}
#spin:disabled{animation:none}
.dial.enter{animation:dIn 1.4s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes dIn{from{transform:rotate(-600deg) scale(.1);opacity:0}to{transform:none;opacity:1}}
.dial.leave{animation:dOut .85s ease-in both}
@keyframes dOut{to{transform:rotate(420deg) scale(.1);opacity:0}}
.save{color:var(--gold);letter-spacing:.15em;font-size:.95rem;margin:16px 0 4px;animation:bob 2.6s ease-in-out infinite}
.front::after{pointer-events:none}
.front img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#spin{font-size:1.35rem;padding:18px 0;width:86%;max-width:300px;margin-top:24px;border:2px solid #fff3c9;border-radius:999px;color:#3a1d5c;font-weight:700;letter-spacing:.16em;text-shadow:0 1px 0 #fff8;background:linear-gradient(180deg,#fff0c0,#e8c878 48%,#b08a38);box-shadow:0 0 0 3px #2a1a4d,0 0 0 5px var(--gold),0 8px 18px rgba(0,0,0,.45),inset 0 2px 0 #fffb,inset 0 -5px 10px rgba(130,90,20,.35);animation:sg 2s ease-in-out infinite}
@keyframes sg{50%{box-shadow:0 0 0 3px #2a1a4d,0 0 0 5px var(--gold),0 0 30px 4px rgba(224,112,154,.8),0 8px 18px rgba(0,0,0,.45),inset 0 2px 0 #fffb,inset 0 -5px 10px rgba(130,90,20,.35)}}
#spin:active{transform:translateY(2px) scale(.98)}
#spin:disabled{animation:none;filter:saturate(.6) brightness(.85)}
</style>
</head>
<body>
<div class="lace"></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="cn" viewBox="0 0 100 100"><g fill="none" stroke="#e2c27a" stroke-width="2.2" stroke-linecap="round"><path d="M4 98V34C4 16 16 4 34 4H98"/><path d="M13 98V38C13 24 24 13 38 13H98" stroke-width="1.2"/><path d="M26 40C26 32 32 26 40 26"/><path d="M40 26C46 26 48 32 44 35C41 37 37 35 38 32"/><path d="M50 8C56 20 62 22 72 20"/><path d="M8 50C20 56 22 62 20 72"/></g><g fill="#e2c27a"><circle cx="30" cy="30" r="3.4"/><circle cx="62" cy="9" r="2"/><circle cx="9" cy="62" r="2"/><circle cx="82" cy="9" r="1.5"/><circle cx="9" cy="82" r="1.5"/></g></symbol></defs></svg>
<svg class="corner c1"><use href="#cn"/></svg><svg class="corner c2"><use href="#cn"/></svg><svg class="corner c3"><use href="#cn"/></svg><svg class="corner c4"><use href="#cn"/></svg>
<div id="fl"></div>
<main>
<section class="view on" id="v-home"><div class="home">
<p class="kicker">✦ ✧ 命運占卜所 ✧ ✦</p>
<div class="seal"><div class="glow2"></div>
<svg class="z1" viewBox="0 0 300 300" fill="none" stroke="#e2c27a"><circle cx="150" cy="150" r="146" stroke-width="2"/><circle cx="150" cy="150" r="104" stroke-width="1.2"/><circle cx="150" cy="150" r="140" stroke-dasharray="1 6" stroke-width="3"/><g id="zd" fill="#e2c27a" stroke="none" font-size="19" text-anchor="middle"></g></svg>
<svg class="z2" viewBox="0 0 300 300" fill="none" stroke="#e2c27a"><circle cx="150" cy="150" r="96" stroke-width="1.5"/><circle cx="150" cy="150" r="70" stroke-dasharray="5 4"/><path d="M150 56L231 197H69Z" stroke-width="1"/><path d="M150 244L69 103H231Z" stroke-width="1"/><g id="md" font-size="15" text-anchor="middle" stroke="none"></g></svg>
<svg viewBox="0 0 300 300"><g fill="none" stroke="#e2c27a" stroke-width="2" stroke-linecap="round"><path d="M92 150Q150 100 208 150Q150 200 92 150Z" fill="#1a1440"/><path d="M150 58V84M118 66l8 20M182 66l-8 20M96 84l12 14M204 84l-12 14" stroke-width="1.5"/></g><circle cx="150" cy="150" r="24" fill="#6fb0f0" stroke="#e2c27a" stroke-width="2"/><circle cx="150" cy="150" r="10" fill="#1a1440"/><path d="M150 140l2.5 7 7 .8-5.4 4.4 1.8 7-5.9-3.6-5.9 3.6 1.8-7-5.4-4.4 7-.8z" fill="#fff3c9" transform="translate(0 1) scale(.9) translate(15 16)"/><path d="M150 222a22 22 0 1 0 0 0" fill="none"/><path d="M158 214A18 18 0 1 0 158 250A14 14 0 1 1 158 214Z" fill="#e2c27a"/></svg>
</div>
<h1 class="tt">創造你的<br>專屬酷洛米！</h1>
<div class="div">❦ ✦ ❦</div>
<p class="lead">月光已升起，星辰正在低語。<br>穿越四道命運之門，轉動命運之輪，<br>讓星象為你揭曉專屬的酷洛米牌卡。</p>
<p class="cap">✦ 翻開四張命運籤 ✦</p><div class="gates"><div><b><i>🌙</i></b>月光兜帽<small>I</small></div><div><b><i>🎀</i></b>暗夜小飾<small>II</small></div><div><b><i>🍒</i></b>甜蜜信物<small>III</small></div><div><b><i>👗</i></b>夢幻裙擺<small>IV</small></div></div>
<button id="go">✦ 點擊開始 ✦</button>
</div></section>
<section class="view" id="v-w"></section>
<section class="view" id="v-card">
  <p class="kicker" style="margin-top:6px">✦ ✧ YOUR CARD ✧ ✦</p>
  <p class="t2">命運已揭曉</p>

(()=>{const z="♈♉♊♋♌♍♎♏♐♑♒♓".split("");let s="";
 z.forEach((g,i)=>{const[x,y]=P(i*30,124,150);s+=`<text x="${x}" y="${y+6}">${g}\uFE0E</text>`});$("zd").innerHTML=s;
 const m=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];s="";

function wheelSVG(w){
 let s='<circle cx="100" cy="100" r="104" fill="#a88434"/><circle cx="100" cy="100" r="100" fill="#2a1a4d"/><circle cx="100" cy="100" r="96" fill="#e2c27a"/>';
 for(let k=0;k<18;k++){const[x,y]=P(k*20,100);s+=`<circle cx="${x}" cy="${y}" r="2.4" fill="${k%2?'#fff3c9':'#e0405a'}"/>`}
 s+='<g class="rot">';
 w.o.forEach((o,i)=>{
  const[x0,y0]=P(i*60-30,92),[x1,y1]=P(i*60+30,92);
  s+=`<path d="M100 100L${x0} ${y0}A92 92 0 0 1 ${x1} ${y1}Z" fill="${o[1]}" stroke="#e2c27a" stroke-width="2"/>`;
  s+=`<text transform="rotate(${i*60} 100 100)" x="100" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#2a1a4d">${o[0]}</text>`;
 });

}

  $("fl").appendChild(s)}})();
function burst(host,n,sym){
 for(let i=0;i<n;i++){const s=document.createElement("span");s.className="sp";
  const a=Math.random()*6.283,r=90+Math.random()*170;
  s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");
  s.style.animationDelay=Math.random()*.4+"s";s.textContent=sym[i%sym.length];host.appendChild(s);
  setTimeout(()=>s.remove(),2400)}
}

 <button id="spin">${done[i]?(i<3?"前往下一道命運 →":"生成牌卡 ✦"):"🔮 轉動命運之輪 🔮"}</button>
 <div class="nxt" id="nxt"></div></div>`;
 const rot=v.querySelector(".rot");
 if(done[i]){rot.style.transition="none";rot.style.transform=`rotate(${cur[i]}deg)`}
 $("spin").onclick=()=>{
  if(done[i]){go(i);return}
  const b=$("spin");b.disabled=true;b.textContent="命運轉動中…";
  let n=360*5+(360-w.hit*60)+Math.random()*36-18;cur[i]=n;
  rot.style.transform=`rotate(${n}deg)`;
  setTimeout(()=>{
   done[i]=true;$("res").textContent="✨ "+w.o[w.hit][0];$("fort").textContent=w.f;$("fort").classList.add("on");
   burst($("bh"),22,["✦","✧","🍒","⭐"]);
   $("nxt").textContent=i<3?"星辰正引領你前往下一道命運之門…":"四道命運已齊聚，牌卡即將誕生…";
   document.querySelectorAll(".prog b")[i].className="d";
   setTimeout(()=>{if(location.hash==="#w"+(i+1))go(i)},2800);
  },4100);
 };
}
function go(i){const d=document.querySelector(".dial"),s=$("spin");if(d)d.classList.add("leave");if(s)s.disabled=true;setTimeout(()=>{if(i<3)location.hash="w"+(i+2);else gen()},850)}
function gen(){
 if(busy)return;busy=true;$("ov").classList.add("on");
 const pb=$("pb");pb.style.transition="none";pb.style.width="0";void pb.offsetWidth;pb.style.transition="";pb.style.width="100%";
 steps.forEach((t,k)=>setTimeout(()=>{$("st").textContent=t;burst($("ov"),10,["✦","✧","🍒","🎀"])},k*1000));
 setTimeout(()=>{const f=$("fx");f.style.transition="opacity .5s";f.style.opacity=1},5600);
 setTimeout(()=>{busy=false;location.hash="card"},6200);
}
const steps=["匯集四道命運的力量…","染上藍色頭套…","繫上骷髏蝴蝶結…","綴上一顆紅櫻桃…","縫製波點蕾絲裙…","牌卡誕生 ✦"];
$("go").onclick=()=>{started=true;location.hash="w1"};
$("again").onclick=()=>{done.fill(false);cur.fill(0);started=false;location.hash="home"};
function show(id){["v-home","v-w","v-card"].forEach(x=>$(x).classList.toggle("on",x===id));window.scrollTo(0,0)}
function route(){
 const h=location.hash.slice(1)||"home",first=done.indexOf(false),all=first<0;
 if(!busy)$("ov").classList.remove("on");
 if(h==="home"||(!started&&h!=="home")){if(h!=="home"){location.hash="home";return}show("v-home");return}
 const m=/^w([1-4])$/.exec(h);
 if(m){const i=+m[1]-1;if(!all&&i>first){location.hash="w"+(first+1);return}
  renderWheel(i);show("v-w");return}
 if(h==="card"){
  if(!all){location.hash=started?"w"+(first+1):"home";return}
  show("v-card");const f=$("fx");setTimeout(()=>{f.style.transition="none";f.style.opacity=0},50);
  $("inn").classList.remove("go");
  $("chips").innerHTML=W.map((w,i)=>`<span class="chip" style="animation-delay:${2.2+i*.35}s">${w.o[w.hit][0]}</span>`).join("");
  setTimeout(()=>$("inn").classList.add("go"),1300);
  setTimeout(()=>burst($("bst"),36,["✦","✧","🍒","🌹","⭐"]),2300);
  return}
 location.hash="home";
}
addEventListener("hashchange",route);
route();
</script>
